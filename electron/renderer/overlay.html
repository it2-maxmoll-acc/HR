<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Оверлей</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="container" id="container">
      <div class="titlebar">
        <span class="brand">🎙 Расшифровка</span>
        <div class="opacity-wrap">
          <label for="opacity-slider">Прозрачность</label>
          <input id="opacity-slider" type="range" min="15" max="100" value="85" step="5" />
        </div>
        <button id="close-btn" title="Закрыть">✕</button>
      </div>
      <div id="log" class="log"></div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
