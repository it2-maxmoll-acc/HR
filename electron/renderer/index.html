<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src *; media-src * blob:; img-src 'self' data:;"
    />
    <title>Realtime Transcriber</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <span>Realtime Transcriber</span>
      </div>
      <div id="status" class="status">Готов к записи</div>
      <div id="timer" class="timer">00:00</div>
    </header>

    <section class="controls">
      <label>
        <span>Микрофон (HR)</span>
        <select id="mic-select"></select>
      </label>
      <label>
        <span>Системный звук (Кандидат)</span>
        <select id="sys-select">
          <option value="loopback">Системный звук (весь ПК)</option>
        </select>
      </label>
      <label>
        <span>Чувствительность к тишине: <b id="sens-value">3</b> / 5</span>
        <input
          id="sensitivity"
          type="range"
          min="1"
          max="5"
          step="1"
          value="3"
        />
      </label>
      <label>
        <span>Режим подключения</span>
        <select id="mode-select">
          <option value="proxy">🌐 Через сервер — для РФ (ключ не нужен)</option>
          <option value="direct">🔑 Напрямую OpenAI (нужен API Key)</option>
        </select>
      </label>
      <label class="endpoint" id="server-url-row">
        <span>URL вашего приложения на Lovable</span>
        <input
          id="server-url"
          type="text"
          placeholder="https://ваш-проект.lovable.app"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label class="endpoint hidden" id="api-key-row">
        <span>OpenAI API Key</span>
        <input
          id="api-key"
          type="password"
          placeholder="sk-..."
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <label>
        <span>Модель транскрипции</span>
        <select id="model-select">
          <option value="whisper-1">whisper-1 (быстро, без лимитов)</option>
          <option value="gpt-4o-transcribe">gpt-4o-transcribe (точнее)</option>
          <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe (баланс)</option>
        </select>
      </label>
      <div class="buttons">
        <button id="start" class="btn primary">▶ Начать запись</button>
        <button id="stop" class="btn danger" disabled>■ Остановить</button>
        <button id="pause" class="btn pause" disabled>⏸ Пауза</button>
        <button id="save" class="btn ghost" disabled>💾 Сохранить .txt</button>
        <button id="overlay" class="btn ghost">📌 Оверлей</button>
        <button id="history" class="btn ghost">🕐 История</button>
      </div>
    </section>

    <div id="banner" class="banner hidden"></div>

    <div class="log-header">
      <span>Расшифровка</span>
      <button id="download" class="btn download" disabled>
        ⬇ Скачать .txt
      </button>
    </div>

    <main id="log" class="log" aria-live="polite"></main>

    <!-- ====== History panel ====== -->
    <div id="history-panel" class="history-panel hidden">
      <div class="history-header">
        <span>История записей</span>
        <button id="history-close" class="btn ghost small">✕ Закрыть</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <!-- Session text viewer -->
      <div id="history-viewer" class="history-viewer hidden">
        <div class="history-viewer-header">
          <span>Просмотр записи</span>
          <button id="history-viewer-close" class="btn ghost small">✕</button>
        </div>
        <pre id="history-viewer-content" class="history-viewer-content"></pre>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
